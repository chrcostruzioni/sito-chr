titolo_it: Ristrutturazione completa di una casa a Pianoro
titolo_en: Full renovation of a house in Pianoro
descrizione_it: "Un lavoro complesso: abbiamo cambiato tutta la planimetria della casa, trasformato le finestre in portefinestre sul giardino e aperto una nuova porta d'ingresso nel muro portante, con cerchiatura in acciaio. Poi impianti, parquet a spina di pesce, cucina e finiture."
descrizione_en: "A complex job: we changed the entire floor plan of the house, turned the windows into French doors onto the garden and opened a new front door in the load-bearing wall, with a steel frame. Then the plumbing and wiring, herringbone wood floor, kitchen and finishes."
