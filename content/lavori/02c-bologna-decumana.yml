descrizione_it: Un appartamento rinnovato dalla demolizione alle finiture. Vecchi pavimenti tolti, nuovi impianti elettrici e scarichi, bagno nuovo con piatto doccia filo pavimento e rivestimento in grande formato, parquet levigato, lavori in cartongesso, nuovo pavimento e pareti tinteggiate.
descrizione_en: A flat renovated from demolition to finishes. Old floors removed, new wiring and drains, a new bathroom with a flush shower tray and large-format tiles, sanded parquet, plasterboard work, new flooring and freshly painted walls.
