titolo_en: Renovation of a house in Medicina
descrizione_it: Un cantiere seguito dalla demolizione alle finiture. Nuovi impianti idraulici, di riscaldamento ed elettrici, nuove tramezze, scarichi rifatti sotto pavimento, massetti, nuovi infissi, rivestimenti in grande formato e collettore chiuso in cartongesso.
descrizione_en: A job followed from demolition to finishes. New plumbing, heating and wiring, new partition walls, drains redone under the floor, screeds, new windows, large-format tiles and the manifold enclosed in plasterboard.
